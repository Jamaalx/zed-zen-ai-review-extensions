name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate manifest.json
        run: node -e "const m=require('./manifest.json'); if(m.manifest_version!==3) throw new Error('MV3 required'); console.log(m.name, m.version)"
      - name: Syntax-check scripts
        run: for f in *.js; do node --check "$f"; done
      - name: Package zip artifact
        run: zip -r review-assistant.zip manifest.json *.js *.html *.css icons
      - uses: actions/upload-artifact@v7
        with:
          name: extension-zip
          path: review-assistant.zip
          retention-days: 7
